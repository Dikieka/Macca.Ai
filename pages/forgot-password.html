<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lupa Kata Sandi — Macca.Ai</title>
<meta name="description" content="Reset kata sandi akun Macca.Ai kamu." />
<meta name="robots" content="noindex, nofollow" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Lupa Kata Sandi — Macca.Ai" />
<meta property="og:description" content="Reset kata sandi akun Macca.Ai kamu." />
<meta property="og:image" content="../assets/icons/icon-512.png" />
<meta property="og:url" content="https://macca.ai/pages/forgot-password.html" />
<meta property="og:site_name" content="Macca.Ai" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Lupa Kata Sandi — Macca.Ai" />
<meta name="twitter:description" content="Reset kata sandi akun Macca.Ai kamu." />
<meta name="twitter:image" content="../assets/icons/icon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="../assets/icons/site.webmanifest" />
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink:{900:'#EDF0F7',700:'#B7BECF',500:'#7B8298'}, paper:{50:'#0A0C11',100:'#14161F',200:'#20232F'}, amber:{500:'#FFC145',600:'#E0A62E'}, sage:{500:'#3CE6A6',100:'#10261F'}, clay:{500:'#FF5C7A'}, lime:{500:'#C6FF3D',600:'#A6DE22'} },
    fontFamily: { display:['Space Grotesk','sans-serif'], sans:['Inter','system-ui','sans-serif'], mono:['JetBrains Mono','monospace'], pixel:['"Press Start 2P"','monospace'] }
  }}}
</script>
</head>
<body class="bg-paper-50 text-[var(--charcoal-900)] min-h-screen grid place-items-center px-6 relative overflow-hidden">
  <div class="auth-blob auth-blob-1" style="top:-100px;left:-100px"></div>
  <div class="auth-blob auth-blob-2" style="bottom:-60px;right:-60px"></div>

  <div class="w-full max-w-sm relative z-10">
    <a href="../index.html" class="auth-reveal flex items-center gap-2 font-display text-xl font-semibold text-ink-900 mb-10 justify-center" style="--d:0s">
      <span class="w-7 h-7 rounded-sm bg-lime-500 text-paper-50 grid place-items-center font-pixel text-[8px]">M</span> Macca.Ai
    </a>

    <div id="formState" class="auth-reveal doc-card p-6" style="--d:.08s">
      <h1 class="font-display text-xl font-semibold text-ink-900">Lupa kata sandi?</h1>
      <p class="text-sm text-ink-700 mt-2">Masukkan email akunmu, kami akan kirim tautan untuk mengatur ulang kata sandi.</p>

      <form id="forgotForm" class="mt-5 space-y-4">
        <div class="auth-field">
          <label for="email" class="text-sm font-medium text-ink-900">Email</label>
          <input id="email" type="email" required class="mt-1.5 w-full rounded-md border border-[var(--line)] bg-paper-100 px-3.5 py-2.5 text-sm outline-none focus:border-lime-500" placeholder="nama@kampus.ac.id" />
        </div>
        <button id="submitBtn" type="submit" class="btn-ink w-full rounded-md py-3 text-sm font-semibold">Kirim Tautan Reset</button>
      </form>
    </div>

    <div id="successState" class="hidden doc-card p-6 text-center">
      <i data-lucide="mail-check" class="success-pop-icon w-8 h-8 mx-auto text-sage-500"></i>
      <h1 class="font-display text-xl font-semibold text-ink-900 mt-3">Periksa emailmu</h1>
      <p class="text-sm text-ink-700 mt-2">Jika email terdaftar, kami sudah mengirim tautan reset kata sandi. Tautan berlaku 30 menit.</p>
    </div>

    <p class="auth-reveal text-sm text-ink-700 mt-6 text-center" style="--d:.14s">
      <a href="login.html" class="font-semibold text-ink-900 hover:text-amber-600 transition-colors">← Kembali ke halaman masuk</a>
    </p>
    <p class="auth-reveal text-xs text-ink-500 mt-4 text-center" style="--d:.16s">
      <a href="privacy.html" class="hover:text-ink-900">Kebijakan Privasi</a> · <a href="terms.html" class="hover:text-ink-900">Syarat & Ketentuan</a>
    </p>
  </div>

<script type="module">
  import { callApi, ApiError } from "../assets/js/lib/api.js";
  import { showToast, setLoading } from "../assets/js/lib/state.js";

  lucide.createIcons();

  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const btn = document.getElementById("submitBtn");
    setLoading(btn, true, "Mengirim…");
    try {
      await callApi("requestPasswordReset", { email }, { auth: false });
      document.getElementById("formState").classList.add("hidden");
      document.getElementById("successState").classList.remove("hidden");
    } catch (err) {
      showToast(err instanceof ApiError ? err.message : "Gagal mengirim permintaan.", "error");
    } finally {
      setLoading(btn, false);
    }
  });
</script>
</body>
</html>
